<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake — Bose</title>
  <style>
    /* ========== Your provided CSS (kept intact) ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* background-color*/
      --bg-primary-color: #141212;
      --bg-fill-color: #fdfdfd;

      --text-primary-color: #f8f2f2;

      /*spacing variables */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 40px;
      --space-3xl: 48px;

      /*Border color*/
      --border-primary-color: #5c5b5b;

      /*Border Radius*/
      --border-radius-xs: 4px;
      --border-radius-sm: 8px;
      --border-radius-md: 12px;
      --border-radius-lg: 16px;
      --border-radius-xl: 20px;
      --border-radius-2xl: 24px;


      
    }

    html,
    body {
      height: 100%;
      width: 96%;
    }

    html {
      background-color: var(--bg-primary-color);
      color: var(--text-primary-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    main,
    section {
      width: 100%;
      height: 100%;
    }

    section {
      padding: var(--space-2xl);
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: var(--space-lg);
    }

    section .infos {
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .info {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--border-primary-color);
      border-radius: var(--border-radius-sm);
    }

    /* ========== Board styles ========== */
    .board-wrap {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .controls {
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    .board {
      border: 1px solid var(--border-primary-color);
      flex-grow: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
      grid-template-rows: repeat(auto-fill, minmax(30px, 1fr));
      width: 600px;
      /* fixed board size helps consistent grid calculation */
      height: 600px;
      /* small background and rounded corners */
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
      border-radius: 12px;
      overflow: hidden;
    }

    .block {
      border: 1px solid var(--border-primary-color);
      transition: background-color 120ms ease, transform 120ms ease;
      background-clip: padding-box;
    }

    .fill {
      background-color: var(--bg-fill-color);
      transform: scale(0.95);
      border-radius: 6px;
    }

    /* food styling */
    .food {
      background: #f59e0b;
      /* warm orange */
      border-radius: 6px;
      transform: scale(0.9);
      transition: transform 120ms ease;
    }


    
    /* HUD */
    .hud {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .score {
      font-size: 18px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-primary-color);
      background: rgba(255, 255, 255, 0.02);
    }

    .btn {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-primary-color);
      background: transparent;
      color: var(--text-primary-color);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 22px;
      z-index: 10;
      border-radius: 12px;
    }

    /* responsive */
    @media (max-width:900px) {
      .board {
        width: 420px;
        height: 420px;
      }
    }

    @media (max-width:480px) {
      .board {
        width: 90vw;
        height: 90vw;
      }

      .controls {
        min-width: unset;
        width: 100%;
      }

      .board-wrap {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <section>
    <div class="infos">
      <div class="info">Snake Game — <strong>Bose</strong></div>
      <div class="info">Use Arrow keys to move • Press R to restart</div>
    </div>

    <div class="board-wrap">
      <div style="position:relative;">
        <div class="board"></div>

        <!-- game-over overlay (hidden by default) -->
        <div id="overlay" class="overlay" style="display:none;">
          <div id="gameOverText">Game Over</div>
          <div id="finalScore">Score: 0</div>
          <button id="restartBtn" class="btn">Restart</button>
        </div>
      </div>

      <div class="controls">
        <div style="display:flex;gap:8px;flex-direction:column;margin-top:12px;">
          <div class="score">Speed: <span id="speedLabel">1x</span></div>

          <button id="speedUp" class="btn">Increase Speed</button>
          <button id="speedDown" class="btn">Decrease Speed</button>
        </div>

        <div class="hud">
          <div class="score">Score: <span id="score">0</span></div>
          <div class="score">Best: <span id="best">0</span></div>
        </div>

        <div style="display:flex;gap:8px;flex-direction:column;">
          <button id="startBtn" class="btn">Start</button>
          <button id="pauseBtn" class="btn">Pause</button>
        </div>

        <div style="margin-top:12px;color:var(--border-primary-color);font-size:14px;">
          Rules:
          <ul style="margin-left:12px; color:var(--text-primary-color);">
            <li>Eat food to grow and gain points</li>
            <li>Don't hit the walls or yourself</li>
            <li>R to restart</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <script>
    /***** Snake Game JS *****
     - Uses your CSS grid (.board) and block size 30px
     - Coordinates: x = row, y = col
     - Features: food, score, growth, collision, restart, pause
    ********************************/

    const boardEl = document.querySelector('.board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const finalScore = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const blockSize = 30; // must match CSS min size
    let cols = Math.floor(boardEl.clientWidth / blockSize);
    let rows = Math.floor(boardEl.clientHeight / blockSize);

    // dynamic recalculation on resize
    window.addEventListener('resize', () => {
      cols = Math.floor(boardEl.clientWidth / blockSize);
      rows = Math.floor(boardEl.clientHeight / blockSize);
      // we don't rebuild the board during play to avoid complexity;
      // restart for new grid after resize
    });

    // grid blocks map
    const blocks = {}; // blocks["r-c"] => DOM element

    // game state
    let snake = [];
    let direction = 'right';     // 'up' 'down' 'left' 'right'
    let nextDirection = direction; // to avoid multiple key presses per tick
    let food = null;
    let score = 0;
    let best = Number(localStorage.getItem('snakeBest') || 0);
    let interval = null;
    let speed = 120; // milliseconds (lower = faster)
    let running = false;

    bestEl.textContent = best;

    // create grid blocks
    function buildBoard() {
      // remove any previous children
      boardEl.innerHTML = '';
      blocks = {}; // clear map (redeclare isn't allowed for const — so mutate)
    }

    // Because we declared blocks as const object, we need to reset its keys:
    function resetBlocksMap() {
      for (let k in blocks) delete blocks[k];
    }

    // Build the blocks and populate blocks map
    function initGrid() {
      resetBlocksMap();
      boardEl.innerHTML = '';
      // recalc cols/rows to match current board size
      cols = Math.floor(boardEl.clientWidth / blockSize);
      rows = Math.floor(boardEl.clientHeight / blockSize);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const block = document.createElement('div');
          block.classList.add('block');
          // keep a data attribute for debugging if needed
          block.dataset.pos = `${r}-${c}`;
          boardEl.appendChild(block);
          blocks[`${r}-${c}`] = block;
        }
      }
    }

    // initialize snake in the middle
    function resetSnake() {
      const midR = Math.floor(rows / 2);
      const midC = Math.floor(cols / 2);
      snake = [
        { x: midR, y: midC - 1 },
        { x: midR, y: midC },
        { x: midR, y: midC + 1 }, // head at index 0 will be unshifted to front in movement; we will treat index 0 as head for convenience
      ];
      // Make head at front:
      snake.reverse(); // so that snake[0] is head at midC+1
    }

    // clear all fills from grid
    function clearGridFill() {
      for (const key in blocks) {
        blocks[key].classList.remove('fill', 'food');
      }
    }

    function render() {
      clearGridFill();
      // draw food
      if (food) {
        const fkey = `${food.x}-${food.y}`;
        if (blocks[fkey]) blocks[fkey].classList.add('food');
      }
      // draw snake
      snake.forEach((segment, idx) => {
        const key = `${segment.x}-${segment.y}`;
        const el = blocks[key];
        if (el) {
          el.classList.add('fill');
          // slightly shrink tail for visual depth
          // (already handled via .fill transform)
        }
      });
    }

    // choose a random free cell for food (not on snake)
    function spawnFood() {
      const free = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const occupied = snake.some(s => s.x === r && s.y === c);
          if (!occupied) free.push({ x: r, y: c });
        }
      }
      if (free.length === 0) {
        // board full -> player wins
        gameOver(true);
        return;
      }
      const pick = free[Math.floor(Math.random() * free.length)];
      food = pick;
    }

    // check for collisions: wall or self
    function isCollision(head) {
      // wall
      if (head.x < 0 || head.x >= rows || head.y < 0 || head.y >= cols) return true;
      // self
      return snake.some(seg => seg.x === head.x && seg.y === head.y);
    }

    // main game tick
    function tick() {
      // apply queued direction
      direction = nextDirection;

      // compute new head based on current head
      const head = { x: snake[0].x, y: snake[0].y };
      if (direction === 'up') head.x -= 1;
      else if (direction === 'down') head.x += 1;
      else if (direction === 'left') head.y -= 1;
      else if (direction === 'right') head.y += 1;

      // detect collision
      if (isCollision(head)) {
        gameOver(false);
        return;
      }

      // add new head
      snake.unshift(head);

      // did we eat food?
      let ate = false;
      if (food && head.x === food.x && head.y === food.y) {
        ate = true;
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      }

      // if not eaten, remove tail (normal move)
      if (!ate) snake.pop();

      render();
    }

    function startGame() {
      // rebuild grid to be safe (handles resize)
      initGrid();
      resetSnake();
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      scoreEl.textContent = score;
      food = null;
      spawnFood();
      render();

      // clear existing interval
      if (interval) clearInterval(interval);
      interval = setInterval(() => {
        if (running) tick();
      }, speed);

      running = true;
      overlay.style.display = 'none';
    }

    function pauseGame() {
      running = !running;
      pauseBtn.textContent = running ? 'Pause' : 'Resume';
    }

    function gameOver(won = false) {
      running = false;
      clearInterval(interval);
      overlay.style.display = 'flex';
      finalScore.textContent = `Score: ${score}`;
      document.getElementById('gameOverText').textContent = won ? 'You Win!' : 'Game Over';

      // update best score
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', String(best));
        bestEl.textContent = best;
      }
    }

    // restart simply starts a fresh game
    function restart() {
      overlay.style.display = 'none';
      startGame();
    }

    // keyboard handling — use nextDirection to avoid reverse in the same tick
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === 'ArrowUp' && direction !== 'down') nextDirection = 'up';
      else if (key === 'ArrowDown' && direction !== 'up') nextDirection = 'down';
      else if (key === 'ArrowLeft' && direction !== 'right') nextDirection = 'left';
      else if (key === 'ArrowRight' && direction !== 'left') nextDirection = 'right';
      else if (key === 'r' || key === 'R') restart();
      else if (key === ' ') { // space to toggle pause
        e.preventDefault();
        pauseGame();
      }
    });

    // UI buttons
    restartBtn.addEventListener('click', restart);
    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      startGame();
    });
    pauseBtn.addEventListener('click', pauseGame);

    // initial build & start lightly paused (user must press Start)
    initGrid();
    resetSnake();
    render();

    // expose start automatically for convenience (optional)
    // startGame(); // comment out if you want the user to click Start

  </script>
</body>

</html>
